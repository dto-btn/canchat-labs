name: OpenWebUI Release Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: open-webui/open-webui
  UPSTREAM_DIRECTORY: openwebui
  MINIMUM_RELEASE_AGE: 14

defaults:
  run:
    shell: bash

jobs:
  upstream-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.create_token.outputs.token }}

      - name: Find upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
        run: |
          CURRENT_VERSION=$(jq -er '.version' upstream.json)

          CUTOFF=$(date -u -d "$MINIMUM_RELEASE_AGE days ago" +%Y-%m-%dT%H:%M:%SZ)

          LATEST_VERSION=$(gh api --paginate --slurp \
            "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" |
            jq -r --arg cutoff "$CUTOFF" '
              .[][] |
              select(.draft == false and .prerelease == false) |
              select(.published_at <= $cutoff) |
              .tag_name |
              select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            ' |
            sort -V |
            tail -n 1)

          echo "Current version: $CURRENT_VERSION"
          echo "Eligible upstream version: $LATEST_VERSION"

          if [ -z "$LATEST_VERSION" ] || [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "No upstream update required."
            exit 0
          fi

          NEWEST_VERSION=$(printf '%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" |
            sort -V | tail -n 1)

          if [ "$NEWEST_VERSION" != "$LATEST_VERSION" ]; then
            echo "No upstream update required."
            exit 0
          fi

          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing integration
        id: integration
        if: steps.upstream.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          BRANCH="upstream/open-webui-$VERSION"

          OPEN_PRS=$(gh pr list \
            --base main \
            --state open \
            --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("upstream/open-webui-"))] | length')

          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "An upstream integration PR is already open."
            exit 0
          fi

          EXISTING_BRANCH=$(git ls-remote --heads origin "refs/heads/$BRANCH")

          if [ -n "$EXISTING_BRANCH" ]; then
            echo "::error::Integration branch already exists."
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge upstream release
        id: upstream_merge
        if: steps.integration.outputs.branch != ''
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          BRANCH: ${{ steps.integration.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREVIOUS_VERSION=$(jq -er '.version' upstream.json)

          git fetch --no-tags \
            "https://github.com/$UPSTREAM_REPOSITORY.git" \
            "refs/tags/$PREVIOUS_VERSION"

          PREVIOUS_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')

          git fetch --no-tags \
            "https://github.com/$UPSTREAM_REPOSITORY.git" \
            "refs/tags/$VERSION"

          UPSTREAM_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')

          # Compare upstream manifests before removing them from our import.
          MANIFEST_CHANGES=$(git diff --name-only "$PREVIOUS_COMMIT" "$UPSTREAM_COMMIT" -- \
            pyproject.toml uv.lock \
            backend/requirements.txt backend/requirements.lock \
            backend/requirements-slim.txt backend/requirements-slim.lock |
            paste -sd ',' -)

          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest_changes=${MANIFEST_CHANGES:-none}" >> "$GITHUB_OUTPUT"
          echo "Upstream dependency manifests changed: ${MANIFEST_CHANGES:-none}"
          git diff "$PREVIOUS_COMMIT" "$UPSTREAM_COMMIT" -- pyproject.toml

          git switch -c "$BRANCH"

          # Do not follow our manifest moves into the repository root.
          if ! git merge --no-commit --no-ff \
            -s ort \
            -Xno-renames \
            -Xsubtree="$UPSTREAM_DIRECTORY" \
            "$UPSTREAM_COMMIT"; then

            git rev-parse --verify MERGE_HEAD

            CONFLICTS=$(git diff --name-only --diff-filter=U)

            if [ -z "$CONFLICTS" ]; then
              echo "::error::Upstream merge failed unexpectedly."
              exit 1
            fi

            echo "Merge conflicts detected:"
            echo "$CONFLICTS"
          fi

          git rev-parse --verify MERGE_HEAD

      - name: Remove upstream dependency manifests
        if: steps.integration.outputs.branch != ''
        run: |
          # Canchat Labs owns the root pyproject.toml and uv.lock.
          # Remove imported Python manifests and resolve their merge conflicts.

          git rm -f --ignore-unmatch -- \
            "$UPSTREAM_DIRECTORY/pyproject.toml" \
            "$UPSTREAM_DIRECTORY/uv.lock" \
            "$UPSTREAM_DIRECTORY/backend/requirements.txt" \
            "$UPSTREAM_DIRECTORY/backend/requirements.lock" \
            "$UPSTREAM_DIRECTORY/backend/requirements-slim.txt" \
            "$UPSTREAM_DIRECTORY/backend/requirements-slim.lock" \
            "$UPSTREAM_DIRECTORY/backend/update-locks.sh"

      - name: Validate merge conflicts
        if: steps.integration.outputs.branch != ''
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)

          if [ -n "$CONFLICTS" ]; then
            echo "::error::Unresolved upstream merge conflicts."
            echo "$CONFLICTS"
            exit 1
          fi

          echo "No unresolved merge conflicts."

      - name: Validate merge scope
        if: steps.integration.outputs.branch != ''
        run: |
          UNEXPECTED_FILES=$(git diff --cached \
            --no-renames \
            --name-only \
            -- . ":(exclude)$UPSTREAM_DIRECTORY/**")

          if [ -n "$UNEXPECTED_FILES" ]; then
            echo "::error::Upstream merge modified files outside $UPSTREAM_DIRECTORY/"
            echo "$UNEXPECTED_FILES"
            exit 1
          fi

          echo "All upstream changes are within $UPSTREAM_DIRECTORY/"

      - name: Update upstream version
        if: steps.integration.outputs.branch != ''
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' \
            upstream.json > upstream.json.tmp

          mv upstream.json.tmp upstream.json

          git add upstream.json

          git commit -m "fix(upstream): import Open WebUI $VERSION"

      - name: Push integration branch
        if: steps.integration.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          BRANCH: ${{ steps.integration.outputs.branch }}
        run: |
          gh auth setup-git

          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Create pull request
        if: steps.integration.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          BRANCH: ${{ steps.integration.outputs.branch }}
          PREVIOUS_VERSION: ${{ steps.upstream_merge.outputs.previous_version }}
          MANIFEST_CHANGES: ${{ steps.upstream_merge.outputs.manifest_changes }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(upstream): import Open WebUI $VERSION" \
            --body "Imports Open WebUI $VERSION into CanChat Labs.

          Upstream Python dependency manifests have been removed.
          CanChat Labs manages dependencies in the root pyproject.toml and uv.lock.

          Changed upstream dependency manifests: $MANIFEST_CHANGES

          Review upstream dependency changes and reconcile them with our root manifests before merging:
          https://github.com/$UPSTREAM_REPOSITORY/compare/$PREVIOUS_VERSION...$VERSION

          Upstream release:
          https://github.com/$UPSTREAM_REPOSITORY/releases/tag/$VERSION"
