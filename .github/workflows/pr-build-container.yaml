name: Container Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GC Secure Artifacts
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.SECURE_ARTIFACTS_REGISTRY }}
          username: ${{ secrets.SECURE_ARTIFACTS_USERNAME }}
          password: ${{ secrets.SECURE_ARTIFACTS_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./containers/Dockerfile.PullRequest
          platforms: linux/amd64
          push: false
          build-args: |
            NODE_IMAGE=${{ vars.SECURE_NODE_IMAGE }}
            PYTHON_IMAGE=${{ vars.SECURE_PYTHON_IMAGE }}
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=main