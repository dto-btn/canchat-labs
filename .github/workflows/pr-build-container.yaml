name: Container Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read project versions
        id: versions
        shell: bash
        run: |
          NODE_VERSION=$(cat .nvmrc)
          PYTHON_VERSION=$(sed -nE 's/^requires-python = ">=([0-9]+\.[0-9]+),<[^"]+"$/\1/p' pyproject.toml)
          UV_VERSION=$(sed -nE 's/^required-version = "==([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' pyproject.toml)

          test -n "$NODE_VERSION"
          test -n "$PYTHON_VERSION"
          test -n "$UV_VERSION"

          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./containers/Dockerfile.PullRequest
          platforms: linux/amd64
          push: false
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node_version }}
            PYTHON_VERSION=${{ steps.versions.outputs.python_version }}
            UV_VERSION=${{ steps.versions.outputs.uv_version }}
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=main
