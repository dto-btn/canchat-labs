name: Backend CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "openwebui/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr-backend.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: openwebui

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Validate uv lockfile
        run: uv lock --project .. --check

      - name: Verify Python formatting
        run: uv run --project .. --locked --only-dev ruff format --check .

      - name: Detect Python logic errors
        run: >
          uv run --project .. --locked --only-dev ruff check
          --select=F
          --ignore=F401,F403,F405,F541,F811,F841
          --output-format=github
          .
