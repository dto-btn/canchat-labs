name: Frontend CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "openwebui/**"
      - ".nvmrc"
      - ".github/workflows/pr-frontend.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  CYPRESS_INSTALL_BINARY: "0"

defaults:
  run:
    working-directory: openwebui

jobs:
  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      coverage_artifact: ${{ steps.coverage.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: openwebui/package-lock.json

      - name: Install dependencies
        run: npm ci --force

      - name: Run frontend unit tests with coverage
        run: |
          npx --no-install vitest run \
            --coverage \
            --coverage.all \
            --coverage.include="src/**/*.{js,ts,svelte}" \
            --coverage.reporter=text \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reporter=html \
            --coverage.reportOnFailure

      - name: Build frontend
        run: npm run build

      - name: Upload coverage reports
        id: coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: openwebui/coverage/
          if-no-files-found: warn
          retention-days: 14

  coverage-report:
    name: Publish Frontend Coverage
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.frontend.outputs.coverage_artifact != ''

    permissions:
      pull-requests: write

    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: coverage

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          name: Frontend Code Coverage
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes
          show-uncovered-lines: true
          comment-on: pr