[project]
name = "canchat-labs"
version = "0.0.0"
description = "Canchat Labs container dependency environment"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "python-socketio==5.16.2",
    "orjson==3.11.9",
    "cryptography==50.0.0",
    "pyotp==2.9.0",
    "qrcode==8.2",
    "bcrypt==5.0.0",
    "argon2-cffi==25.1.0",
    "PyJWT[crypto]==2.15.0",
    "authlib==1.7.2",
    "joserfc==1.7.6",
    "requests==2.34.2",
    "regex==2026.5.9",
    "google-re2==1.1.20251105", # bounded compilation and linear-time knowledge searches
    "aiohttp==3.14.5", # do not update to 3.13.3 - broken
    "aiodns==3.6.1", # keep pinned: 4.x pulls pycares 5 (c-ares 1.34.6) which breaks DNS on some hosts (#28013, # 28215); opt-in via AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER
    "aiocache==0.12.3",
    "aiofiles==25.1.0",
    "starlette-compress==1.7.1",
    "Brotli==1.2.1",
    "httpx[socks,http2,zstd,cli,brotli]==0.28.1",
    "httpx2==2.16.0",
    "starsessions[redis]==2.2.1",
    "python-mimeparse==2.0.0",
    "sqlalchemy[asyncio]==2.0.50",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.4",
    "pycrdt==0.14.13",
    "redis==8.0.1",
    "hiredis==3.4.2",
    "pytz==2026.2",
    "loguru==0.7.3",
    "asgiref==3.11.1",
    "tiktoken==0.14.0",
    "mcp==2.3.0",
    "openai==2.54.0",
    "langchain-core==1.7.6",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.3",
    "fake-useragent==2.2.0",
    "ftfy==6.3.1",
    "chardet==7.4.3",
    "Markdown==3.10.2",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.1",
    "validators==0.35.0",
    "psutil==7.2.2",
    "pillow==13.0.0",
    "rank-bm25==0.2.2",
    "black==26.10.1",
    "youtube-transcript-api==1.2.4",
    "azure-ai-documentintelligence==1.0.2",
    "azure-identity==1.25.3",
    "azure-search-documents==12.0.0",
    "googleapis-common-protos==1.75.0",
    "psycopg2-binary==2.9.12",
    "pgvector==0.4.2",
    "boto3==1.42.62",
    "ldap3==2.9.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-aiohttp-client==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
]
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
# Shared by the full CPU and CUDA profiles.
full = [
    "brotlicffi==1.2.1.0",
    "anthropic==0.87.0",
    "chromadb==1.5.9",
    "weaviate-client==4.20.3",
    "opensearch-py==3.2.0",
    "transformers==5.22.1",
    "sentence-transformers==5.5.1",
    "accelerate==1.15.0",
    "pyarrow==23.0.1",
    "einops==0.8.2",
    "pypdf==6.21.4",
    "docx2txt==0.9",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "msoffcrypto-tool==6.0.0",
    "pypandoc==1.17",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "pyxlsb==1.0.10",
    "xlrd==2.0.2",
    "sentencepiece==0.2.3",
    "soundfile==0.13.1",
    "opencv-python-headless==4.13.0.92",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "faster-whisper==1.2.1",
    "pydub==0.25.1",
    "ddgs==9.14.4",
    "azure-storage-blob==12.29.0",
    "google-cloud-storage==3.9.0",
    "PyMySQL==1.2.0",
    "pymilvus==2.6.14",
    "qdrant-client==1.20.0",
    "playwright==1.60.0", # Caution: version must match docker-compose.playwright.yaml - Update the docker-compose.yaml if necessary
    "elasticsearch==9.4.1",
    "pinecone==6.0.2",
    "oracledb==3.4.2",
    "av==14.0.1", # Caution: Set due to FATAL FIPS SELFTEST FAILURE, see discussion https://github.com/open-webui/open-webui/discussions/15720
    "colbert-ai==0.2.22",
    "canchat-labs[unstructured]",
]

slim = [
    "numpy==2.5.4",
    "typer==0.25.1",
    "python-dateutil==2.9.0.post0",
]

cpu = [
    "canchat-labs[full]",
    "torch<=2.13.0", # Keep the Raspberry Pi compatibility cap.
    "torchvision",
    "torchaudio",
]

cuda = [
    "canchat-labs[full]",
    "torch<=2.13.0",
    "torchvision",
    "torchaudio",
]

# Retain upstream extra names for compatibility.
# PostgreSQL is included in the shared dependencies.
postgres = []
mariadb = [
    "mariadb==1.1.14",
]
unstructured = [
    "unstructured==0.24.1",
    "preshed==3.0.15", # keep pinned: transitive via unstructured -> spaCy; 3.0.14 breaks HTML extraction (web loader)
]
all = ["canchat-labs[cpu]"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "Q",    # flake8-quotes
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 10
pydocstyle.convention = "google"

[tool.uv]
package = false
required-version = "==0.12.10"

required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }, { extra = "slim" }],
    [{ extra = "full" }, { extra = "slim" }],
    [{ extra = "all" }, { extra = "cuda" }, { extra = "slim" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
